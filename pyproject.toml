[build-system]
requires = ["setuptools>=65.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-risk-register"
version = "0.1.0"
description = "AI Risk Register – Governance & Cybersecurity by Design"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AI Risk Register Contributors" }]
dependencies = []

[project.optional-dependencies]
streamlit = ["streamlit", "plotly"]
yaml = ["PyYAML"]
pdf = ["reportlab"]

[project.scripts]
ai-risk-register = "ai_risk_register.cli:main"
